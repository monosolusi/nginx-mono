# HTTPS for registry.monosolusi.com
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name registry.monosolusi.com;

    ssl_certificate     /etc/letsencrypt/live/registry.monosolusi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/registry.monosolusi.com/privkey.pem;

    client_max_body_size 0;
    chunked_transfer_encoding on;

    location /v2/ {
        proxy_pass http://registry:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Jangan tampung seluruh layer ke disk nginx sebelum diteruskan.
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Registry tidak menyajikan apa pun di luar /v2/.
    location / { return 404; }
}

# HTTPS for activate.monosolusi.com
server{
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name activate.monosolusi.com;

    ssl_certificate     /etc/letsencrypt/live/activate.monosolusi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/activate.monosolusi.com/privkey.pem;

    client_max_body_size 16k;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    error_page 502 503 504 = @down;
    location @down {
        default_type application/json;
        return 503 '{"code":"SERVER_ERROR","message":"the activation service is unreachable; try again shortly"}';
    }

    error_page 413 = @big;
    location @big {
        default_type application/json;
        return 413 '{"code":"BAD_REQUEST","message":"the request body is too large for an activation"}';
    }

    location / {
        proxy_pass http://gateway:81;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
    }
}

# HTTPS for licensing.internal.monosolusi.com
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name licensing.internal.monosolusi.com;

    ssl_certificate     /etc/letsencrypt/live/licensing.internal.monosolusi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/licensing.internal.monosolusi.com/privkey.pem;

    allow 100.64.0.0/10;
    allow fd7a:115c:a1e0::/48;
    deny  all;

    client_max_body_size 256k;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://gateway:80;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}